# Versión para Producción
# Uso: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  abcd-app:
    image: ${ABCD_IMAGE_REF:-registry.diagonaleyewear.net/abcd-control:latest}
    
    # Restart automático
    restart: always
    
    # Límites más estrictos en producción
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    
    # Logs centralizados
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        labels: "service=abcd-control"
    
    # Security
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    
    # Tmpfs para Streamlit
    tmpfs:
      - /tmp
      - /root/.streamlit

    # Persistencia de la lista de vigilancia y del registro de alertas (ambos en ./masterdata_data,
    # compartido con abcd-order-alerts). El resto del filesystem es read_only; los JSON legacy solo se leen.
    # Con cap_drop ALL el root del contenedor no salta permisos: ./masterdata_data debe ser de root (uid 0).
    volumes:
      - ./watchlist_clientes.json:/app/watchlist_clientes.json:ro
      - ./alerta_pedidos_notificados.json:/app/alerta_pedidos_notificados.json:ro
      - ./masterdata_data:/app/data

  abcd-luxoptica-monitor:
    image: ${ABCD_IMAGE_REF:-registry.diagonaleyewear.net/abcd-control:latest}
    restart: always
    healthcheck:
      disable: true

  abcd-kering-scheduler:
    image: ${ABCD_IMAGE_REF:-registry.diagonaleyewear.net/abcd-control:latest}
    restart: always

  abcd-order-alerts:
    image: ${ABCD_IMAGE_REF:-registry.diagonaleyewear.net/abcd-control:latest}
    restart: always
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
        labels: "service=abcd-order-alerts"

  # Opcional: Reverse proxy Nginx integrado
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     - abcd-app
  #   restart: always

  # Opcional: Prometheus para monitoreo
  # prometheus:
  #   image: prom/prometheus:latest
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus_data:/prometheus
  #   restart: always

volumes: {}
