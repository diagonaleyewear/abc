[Unit]
ConditionPathExists=
ConditionPathExists=/etc/cloud-production/compose.private.json

[Service]
WorkingDirectory=/etc/cloud-production
ExecStart=
ExecStart=/usr/bin/docker compose --project-directory /etc/cloud-production --project-name cloud-nas -f /etc/cloud-production/compose.private.json up -d --no-recreate --no-build --pull never --wait --wait-timeout 180
ExecStop=
ExecStop=/usr/bin/docker compose --project-directory /etc/cloud-production --project-name cloud-nas -f /etc/cloud-production/compose.private.json stop --timeout 40
