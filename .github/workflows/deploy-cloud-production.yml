name: Deploy Cloud Production

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-production-abcd-app
  cancel-in-progress: false

jobs:
  verify-release:
    if: github.repository == 'sginfoocio/abc' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check approved publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          import re
          from pathlib import Path
          policy = json.loads(Path("deployment/cloud/approved-release.json").read_text())
          if policy.get("repository") != "sginfoocio/abc":
              raise SystemExit("Release policy repository mismatch.")
          if any(not isinstance(policy.get(key), str) or not re.fullmatch(r"[0-9a-f]{40}", policy[key])
                 for key in ("commit", "previous_commit")):
              raise SystemExit("Release policy commit is invalid.")
          if not re.fullmatch(r"ghcr[.]io/sginfoocio/abc@sha256:[0-9a-f]{64}", policy.get("image", "")):
              raise SystemExit("Release policy image digest is invalid.")
          if any(type(policy.get(key)) is not int or policy[key] < 1
                 for key in ("build_run_id", "build_attempt")):
              raise SystemExit("Release policy publication identity is invalid.")
          expected_sources = {"app_enhanced.py", "app_exports.py", "transform_luxottica_masterdata.py"}
          sources = policy.get("source_sha256")
          if not isinstance(sources, dict) or set(sources) != expected_sources or any(
              not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{64}", value)
              for value in sources.values()
          ):
              raise SystemExit("Release policy source hashes are invalid.")
          if policy["release_status"] != "approved":
              raise SystemExit("No new release is approved; update the reviewed release policy.")
          if policy["commit"] == policy["previous_commit"]:
              raise SystemExit("The approved commit is already the production version.")
          comparison = json.loads(subprocess.check_output([
              "gh", "api", f"repos/sginfoocio/abc/compare/{policy['previous_commit']}...{policy['commit']}"
          ]))
          if comparison["status"] != "ahead":
              raise SystemExit("The approved release is not a forward update from production.")
          run = json.loads(subprocess.check_output([
              "gh", "api", f"repos/sginfoocio/abc/actions/runs/{policy['build_run_id']}/attempts/{policy['build_attempt']}"
          ]))
          if not (
              run.get("conclusion") == "success" and run.get("event") == "push"
              and run.get("head_branch") == "main" and run.get("head_sha") == policy["commit"]
              and run.get("path") == ".github/workflows/deploy.yml"
              and run.get("run_attempt") == policy["build_attempt"]
          ):
              raise SystemExit("Pinned image has no matching successful main publication.")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## Approved Cloud release\nCommit: `{policy['commit']}`\n\n")
              summary.write(f"Image: `{policy['image']}`\n\n")
              summary.write("Target: `cloud-nas / abcd-app` only. Awaiting production approval.\n")
          PY

  deploy-production:
    name: Deploy approved abcd-app
    needs: verify-release
    environment: production
    runs-on: [self-hosted, linux, x64, cloud-production]
    timeout-minutes: 25
    permissions: {}
    steps:
      - name: Deploy root-approved release
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          RECEIPT="$(mktemp "$RUNNER_TEMP/cloud-deploy.XXXXXX")"
          trap 'rm -f "$RECEIPT"' EXIT
          STATUS=0
          printf '{"run_id":%s,"attempt":%s}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" |
            sudo -n -- /usr/local/sbin/cloud-production-deploy > "$RECEIPT" || STATUS=$?
          {
            echo '## Cloud production deployment'
            echo '```json'
            cat "$RECEIPT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RECEIPT"
          exit "$STATUS"
