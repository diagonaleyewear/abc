name: Deploy Cloud Production

on:
  workflow_dispatch:
  # Inert unless the repository variable CLOUD_AUTO_DEPLOY is exactly "true".
  workflow_run:
    workflows: ["Deploy to Production"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-production-abcd-app
  cancel-in-progress: false

jobs:
  verify-release:
    if: >-
      github.repository == 'sginfoocio/abc' && github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          vars.CLOUD_AUTO_DEPLOY == 'true'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check verifiable publication of this main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          commit = os.environ["GITHUB_SHA"]
          statuses = json.loads(subprocess.check_output([
              "gh", "api", f"repos/sginfoocio/abc/commits/{commit}/statuses?per_page=100"
          ]))
          statuses = [item for item in statuses if item.get("context") == "cloud-production/published-image"]
          if not statuses:
              raise SystemExit("This commit has no recorded image publication.")
          latest = statuses[0]
          match = re.fullmatch(
              r"(ghcr[.]io/sginfoocio/abc@sha256:[0-9a-f]{64}) actions-([1-9][0-9]*)-([1-9][0-9]*)",
              latest.get("description") or "",
          )
          if latest.get("state") != "success" or match is None:
              raise SystemExit("The recorded image publication is not valid.")
          run = json.loads(subprocess.check_output([
              "gh", "api", f"repos/sginfoocio/abc/actions/runs/{match[2]}/attempts/{match[3]}"
          ]))
          if not (
              run.get("conclusion") == "success" and run.get("event") == "push"
              and run.get("head_branch") == "main" and run.get("head_sha") == commit
              and run.get("path") == ".github/workflows/deploy.yml"
              and run.get("run_attempt") == int(match[3])
          ):
              raise SystemExit("Recorded image has no matching successful main publication.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## Cloud release candidate\nCommit: `{commit}`\n\n")
              summary.write(f"Image: `{match[1]}`\n\n")
              summary.write("The root controller re-derives and re-verifies all identities. ")
              summary.write("Target: `cloud-nas / abcd-app` only. Awaiting production approval.\n")
          PY

  deploy-production:
    name: Deploy approved abcd-app
    needs: verify-release
    environment: production
    runs-on: [self-hosted, linux, x64, cloud-production]
    timeout-minutes: 25
    permissions: {}
    steps:
      - name: Deploy root-approved release
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          RECEIPT="$(mktemp "$RUNNER_TEMP/cloud-deploy.XXXXXX")"
          trap 'rm -f "$RECEIPT"' EXIT
          STATUS=0
          printf '{"run_id":%s,"attempt":%s}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" |
            sudo -n -- /usr/local/sbin/cloud-production-deploy > "$RECEIPT" || STATUS=$?
          {
            echo '## Cloud production deployment'
            echo '```json'
            cat "$RECEIPT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RECEIPT"
          exit "$STATUS"
